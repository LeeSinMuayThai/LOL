<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Lolero · Arcade</title>
    <link rel="preload" href="./src/ui/estilos/fuentes/mona-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/ui/estilos/fuentes/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/ui/estilos/tokens.css" />
    <link rel="stylesheet" href="./src/ui/estilos/base.css" />
    <link rel="stylesheet" href="./src/ui/estilos/primitivos.css" />
    <link rel="stylesheet" href="./src/ui/estilos/decision.css" />
    <link rel="stylesheet" href="./src/ui/estilos/minijuegos.css" />
    <link rel="stylesheet" href="./src/ui/estilos/serie.css" />
    <link rel="stylesheet" href="./src/ui/estilos/transmision.css" />
    <link rel="stylesheet" href="./src/ui/estilos/fx.css" />
    <style>
      /* La compuerta del arcade (PLANUI §0.10, H3k): las mecánicas sueltas, con el marco real de la parada. */
      body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 80% -10%, var(--bg-raised), transparent 60%), var(--bg-void); color: var(--ink); font-family: var(--f-cuerpo); }
      .ar { max-width: 1180px; margin: 0 auto; padding: 40px 16px 80px; display: grid; gap: 22px; }
      .ar-kicker { font: 600 var(--t-rotulo) / 1 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); }
      .ar h1 { margin: 10px 0 6px; font: 800 clamp(38px, 7vw, 76px) / 0.95 var(--f-display); font-stretch: 125%; letter-spacing: -0.02em; text-transform: uppercase; }
      .ar-bajada { margin: 0; max-width: 720px; color: var(--ink-dim); font-size: 16px; line-height: 1.5; }
      .ar-grilla { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start; }
      .ar-col { display: grid; gap: 14px; }
      .ar-lista { display: grid; gap: 8px; }
      .ar-mecanica { display: grid; gap: 3px; text-align: left; padding: 11px 14px; border: 0; border-radius: var(--r-control); background: var(--panel); box-shadow: inset 0 0 0 1px var(--linea); color: var(--ink); cursor: pointer; font: inherit; }
      .ar-mecanica b { font: 800 17px / 1.1 var(--f-display); font-stretch: 110%; }
      .ar-mecanica small { color: var(--ink-dim); font: 400 13px / 1.35 var(--f-cuerpo); letter-spacing: 0; text-transform: none; }
      .ar-mecanica[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--gold); }
      .ar-mecanica:disabled { opacity: 0.45; cursor: default; }
      .ar-rol { font: 600 10.5px / 1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--luz-escenario); }
      .ar-opciones { display: grid; gap: 12px; padding: 14px; border-radius: var(--r-control); background: var(--panel); box-shadow: inset 0 0 0 1px var(--linea); }
      .ar-opciones label, .ar-opciones legend { font: 600 var(--t-rotulo) / 1.2 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); }
      .ar-opciones fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: 8px; }
      .ar-varas { display: flex; gap: 6px; }
      .ar-varas label { flex: 1; text-align: center; padding: 9px 0; border-radius: var(--r-control); background: var(--bg-raised); color: var(--ink); cursor: pointer; font-size: 14px; letter-spacing: 0.04em; }
      .ar-varas input { position: absolute; opacity: 0; pointer-events: none; }
      .ar-varas label:has(input:checked) { box-shadow: inset 0 0 0 2px var(--gold); color: var(--gold); }
      .ar-opciones input[type="range"] { width: 100%; accent-color: var(--gold); }
      .ar-opciones select { padding: 8px; border-radius: var(--r-control); background: var(--bg-raised); color: var(--ink); border: 0; box-shadow: inset 0 0 0 1px var(--linea-fuerte); font: inherit; }
      .ar-escenario { display: grid; gap: 14px; min-width: 0; }
      .ar-escenario .minijuego { width: 100%; box-sizing: border-box; }
      .ar-salida { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 18px; border-radius: var(--r-control); background: var(--panel); box-shadow: inset 0 0 0 1px var(--linea-fuerte); }
      .ar-salida[hidden] { display: none; }
      .ar-salida p { margin: 0; flex: 1; color: var(--ink-dim); }
      .ar-salida button { padding: 10px 18px; border: 0; border-radius: 999px; background: var(--bg-raised); color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold-hondo); font: 800 15px / 1 var(--f-display); cursor: pointer; }
      @media (max-width: 860px) {
        .ar { padding-top: 24px; }
        .ar-grilla { grid-template-columns: 1fr; }
        .ar-escenario { order: -1; }
        .ar-lista { grid-template-columns: 1fr 1fr; }
        .ar-mecanica small { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="ar">
      <header>
        <div class="ar-kicker">Lolero · el arcade</div>
        <h1>El arcade</h1>
        <p class="ar-bajada">Las mecánicas de las finales, sueltas, para jugarlas antes que nadie. Elegí la vara (lo que pide el mapa), tu stat (cuánto te abre la ventana) y jugá con el marco de la parada de verdad.</p>
      </header>
      <div class="ar-grilla">
        <aside class="ar-col">
          <div class="ar-opciones">
            <fieldset>
              <legend>La vara del mapa</legend>
              <div class="ar-varas">
                <label><input type="radio" name="vara" value="0.5" />,50</label>
                <label><input type="radio" name="vara" value="0.7" checked />,70</label>
                <label><input type="radio" name="vara" value="0.85" />,85</label>
              </div>
            </fieldset>
            <label for="arStat">Tu mecánica: <span id="arStatValor">60</span></label>
            <input id="arStat" type="range" min="20" max="100" step="1" value="60" />
            <label for="arRol">Tu rol</label>
            <select id="arRol">
              <option value="top">Top</option>
              <option value="jungla" selected>Jungla</option>
              <option value="mid">Mid</option>
              <option value="adc">ADC</option>
              <option value="support">Support</option>
            </select>
          </div>
          <div id="arLista" class="ar-lista" aria-label="Las mecánicas"></div>
        </aside>
        <section class="ar-escenario">
          <div id="minijuego" class="minijuego panel" hidden>
            <div id="minijuegoTitle" class="titulo-parada"></div>
            <div id="minijuegoDesc" class="planteo"></div>
            <div id="minijuegoApuesta"></div>
            <div id="minijuegoWidget" class="minijuego-widget"></div>
          </div>
          <div id="arSalida" class="ar-salida" hidden>
            <p id="arSalidaTexto"></p>
            <button id="arOtra" type="button">Otra vez</button>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="./src/ui/arcade/pagina.js"></script>
  </body>
</html>
