<html lang="es">
  <head>

    <link rel="preload" href="./src/ui/estilos/fuentes/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/ui/estilos/fuentes/barlow-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/ui/estilos/tokens.css" />
    <link rel="stylesheet" href="./src/ui/estilos/base.css" />
    <link rel="stylesheet" href="./src/ui/estilos/primitivos.css" />
    <link rel="stylesheet" href="./src/ui/estilos/feed.css" />

    <!-- El shell (fase T1; V2-C): la franja, el escenario de una columna y el acompañante. -->
    <link rel="stylesheet" href="./src/ui/estilos/shell.css" />
    <link rel="stylesheet" href="./src/ui/estilos/iconos.css" />
    <link rel="stylesheet" href="./src/ui/estilos/hud.css" />
    <link rel="stylesheet" href="./src/ui/estilos/overlay.css" />
    <link rel="stylesheet" href="./src/ui/estilos/material.css" />
    <link rel="stylesheet" href="./src/ui/estilos/cuartos.css" />
  </head>
  <body>
    <a class="saltar-al-contenido" href="#escenario">Saltar al contenido</a>

    <div class="shell" data-pieza="inicio">
      <!-- La franja (FASE V, V2-C; PLAN.md §V.4): `#franjaEstado` lo llena src/ui/franja.js desde la `vista` (lo que la
           pantalla ya contó). Velocidad y sonido se encienden cuando cargan los módulos (app.js, iniciarSetup). -->
      <header class="franja" id="franja">
        <div class="franja-lockup"><span class="franja-monograma">S+</span><span class="franja-nombre">Un Split Más</span></div>
        <div class="franja-estado" id="franjaEstado"></div>
        <!-- Los cuartos (V2-C): la letra de aria-keyshortcuts abre cada uno (teclado.js); en el celular, abajo y fija. -->
        <nav class="franja-cuartos" id="cuartosBarra" aria-label="Cuartos">
          <button type="button" class="cuarto-boton" data-cuarto="vos" aria-keyshortcuts="V"><span class="cuarto-letra">V</span>os</button>
          <button type="button" class="cuarto-boton" data-cuarto="temporada" aria-keyshortcuts="T"><span class="cuarto-letra">T</span>emporada</button>
          <button type="button" class="cuarto-boton" data-cuarto="equipo" aria-keyshortcuts="E"><span class="cuarto-letra">E</span>quipo</button>
          <button type="button" class="cuarto-boton" data-cuarto="mundo" aria-keyshortcuts="M"><span class="cuarto-letra">M</span>undo</button>
          <button type="button" class="cuarto-boton" data-cuarto="carrera" aria-keyshortcuts="C"><span class="cuarto-letra">C</span>arrera</button>
          <button type="button" class="cuarto-boton" data-cuarto="cronica" aria-keyshortcuts="R">C<span class="cuarto-letra">r</span>ónica</button>
        </nav>
        <div class="franja-controles">
          <button type="button" id="ayudaTeclas" class="franja-toggle" aria-keyshortcuts="?" title="Teclas (?)" disabled>?</button>
          <button type="button" id="toggleVelocidad" class="franja-toggle" disabled title="Velocidad del reproductor">1×</button>
          <button type="button" id="toggleSonido" class="franja-toggle" disabled title="Sonido" aria-pressed="false"></button>
        </div>
      </header>

      <!-- El cuerpo (V2-C): el escenario, una columna con UNA pieza a la vista, y el acompañante al costado. -->
      <div class="shell-cuerpo">
        <div class="escenario" id="escenario">
          <div id="setup" class="panel" data-piezas="inicio">
            <h1 class="solo-lectores">Un Split Más</h1>
            <p class="subtitle">Elegís tu línea y tus mains. El resto de la carrera sale de ahí.</p>
            <section id="desafioDia" class="desafio-dia" aria-label="Desafío del día" hidden></section>

            <div class="paso">
              <div class="paso-label">Tu handle (opcional)</div>
              <input id="handleInput" class="handle-input" type="text" maxlength="16" placeholder="vacío = uno al azar" />
            </div>

            <div class="paso"><div class="paso-label">Tu región</div><div id="regionGrid" class="region-grid" role="radiogroup" aria-label="Tu región"></div><div id="regionTexto" class="perfil-texto"></div></div><div class="paso"><div class="paso-label">Tu perfil</div><div id="perfilGrid" class="perfil-grid" role="radiogroup" aria-label="Tu perfil"></div><div id="perfilTexto" class="perfil-texto"></div></div>
            <div class="paso">
              <div class="paso-label">Tu línea</div>
              <div id="rolGrid" class="rol-grid"></div>
            </div>

            <div class="paso">
              <div class="paso-label">Tus 3 mains</div>
              <div id="draftSlots" class="draft-slots" aria-label="Mains elegidos"></div>
              <div id="campeonGrid" class="campeon-grid"></div>
              <div id="poolContador" class="pool-contador">Elegí una línea primero.</div>
            </div>

            <div class="setup-footer">
              <!-- Fase T8 (P.2): oculto hasta que iniciarSetup() confirme
                   que hay una carrera guardada de verdad. -->
              <button id="continuarBtn" type="button" class="continuar-btn" hidden>
                <span class="continuar-kicker">Continuar</span>
                <span id="continuarDetalle" class="continuar-detalle"></span>
              </button>
              <button id="run" disabled>Empezar carrera</button>
            </div>
            <section id="historial" class="historial" aria-label="Tus últimos resultados" hidden></section>

            <details class="avanzado">
              <summary>Avanzado: fijar una seed</summary>
              <div class="seed-row" style="margin-top: 10px;">
                <label class="seed-label" for="seedInput">Seed</label>
                <input id="seedInput" class="seed-input" type="text" placeholder="un número o un texto; vacío = al azar" />
              </div>
              <p id="seedAviso" class="seed-aviso" role="status" aria-live="polite"></p>
            </details>
          </div>

          <!-- FASE V (V2-B): qué nodo se ve lo decide `.shell[data-pieza]` (lo escribe solo src/ui/escena.js) contra el
               `data-piezas` de cada nodo (estilos/shell.css). Una pieza puede ser varios nodos. -->
          <div id="carrera" class="panel" data-piezas="relato decision partido mercado minijuego final">
            <!-- El bracket + el camino de la serie (fase T6): en la pieza `partido`,
                 mientras `state.serie.activa` (el `hidden` es de su renderer). -->
            <div id="serieContexto" class="serie-contexto" data-piezas="partido" hidden></div>
            <div id="previa" class="previa" data-piezas="partido minijuego" hidden></div>

            <div id="decision" class="decision" data-piezas="decision partido" hidden>
              <div id="decisionTitle" class="decision-title"></div>
              <div id="decisionDesc" class="decision-desc"></div>
              <div id="decisionOptions" class="decision-options"></div>
            </div>

            <div id="minijuego" class="minijuego" data-piezas="minijuego" hidden>
              <div id="minijuegoTitle" class="decision-title"></div>
              <div id="minijuegoDesc" class="decision-desc"></div>
              <div id="minijuegoApuesta"></div>
              <div id="minijuegoWidget" class="minijuego-widget"></div>
            </div>

            <div id="mercado" class="mercado" data-piezas="mercado" hidden>
              <div id="mercadoTitle" class="decision-title"></div>
              <div id="mercadoDesc" class="decision-desc"></div>
              <div id="mercadoVos" hidden></div>
              <div id="mercadoGrid" class="mercado-grid"></div>
              <div id="mercadoMundo" class="mercado-mundo" hidden></div>
              <button id="mercadoRepresentante" type="button" class="mercado-representante-btn" hidden>Llamar a tu representante y ver quién te sigue · 1 vez por carrera</button>
              <button id="mercadoEsperar" type="button" class="mercado-representante-btn" hidden>Esperar · no firmás nada esta ventana</button>
            </div>

            <!-- V2-C (regla 2 de §V.3, "primero lo que se decide"): el chip va DETRÁS de las paradas, no antes del título. Debajo
                 de 1180 px (sin acompañante) abre el cuarto con el contexto de la parada (src/ui/acompanante.js). -->
            <button id="verContexto" type="button" class="ver-contexto" data-piezas="decision partido mercado" hidden></button>

            <div id="logList" class="log-list" aria-live="polite" data-piezas="relato decision partido mercado minijuego"></div>

            <!-- Fase 9R5b: la tarjeta de legado. Se muestra cuando la carrera termina. -->
            <div id="tarjeta" class="tarjeta" data-piezas="final" hidden></div>

            <button id="nuevaCarrera" type="button" data-piezas="final">Nueva carrera</button>
          </div>
        </div>

        <!-- El acompañante (V2-C; PLAN.md §V.4): UN panel con el contexto de la pieza, desde 1180 px. Lo pinta
             src/ui/acompanante.js desde la `vista`; `data-acompanante` dice qué muestra (vacío: nada, y no ocupa lugar). -->
        <aside id="acompanante" class="acompanante" aria-label="Contexto de la parada" data-acompanante="" hidden></aside>
      </div>

      <!-- Los cuartos (V2-C; PLAN.md §V.4): un solo diálogo modal (showModal: foco atrapado, fondo inerte, Esc nativo).
           Las pestañas son copias de #cuartosBarra; el cuerpo se pinta solo al abrirse, desde la `vista` (src/ui/cuartos.js). -->
      <dialog id="cuarto" class="cuarto" aria-labelledby="cuartoTitulo">
        <div class="cuarto-cabecera">
          <h2 id="cuartoTitulo" class="solo-lectores">Cuarto</h2>
          <div class="cuarto-pestanas" role="tablist" aria-label="Cuartos"></div>
          <button type="button" class="cuarto-cerrar" title="Cerrar (Esc)" aria-label="Cerrar"><span class="cuarto-cerrar-texto">Cerrar</span><span class="cuarto-cerrar-x" aria-hidden="true">✕</span> <kbd>Esc</kbd></button>
        </div>
        <div id="cuartoCuerpo" class="cuarto-cuerpo" role="tabpanel" aria-labelledby="cuartoTitulo"></div>
      </dialog>
    </div>

    <script type="module" src="./src/ui/shell.js"></script>
    <!-- El controlador (fase V, PLAN.md "V0 — El kernel"): hasta esta fase
         vivía acá adentro como ~520 líneas de `<script type="module">`.
         Se movió a `src/ui/app.js` (exporta `iniciar()`) para que `estado`
         deje de estar atrapado en un closure que ninguna pantalla nueva
         puede leer — ver `src/ui/core/store.js`. -->
    <script type="module">
      import { iniciar } from './src/ui/app.js';
      iniciar();
    </script>
  </body>
</html>
