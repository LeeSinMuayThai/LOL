<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOL Career Simulator</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(135deg, #0b1020, #141f36 60%, #1d2d4b);
        color: #f3f6ff;
        margin: 0;
        padding: 24px;
      }
      .panel {
        max-width: 960px;
        margin: 0 auto;
        background: rgba(8, 14, 24, 0.92);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 18px;
        padding: 26px;
        box-shadow: 0 18px 70px rgba(0,0,0,0.35);
      }
      h1 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 30px;
      }
      .subtitle {
        color: #9fb0d2;
        margin-bottom: 18px;
      }
      button {
        margin-top: 8px;
        padding: 10px 16px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #2f6fed, #5b8cff);
        color: white;
        cursor: pointer;
        font-weight: 700;
        box-shadow: 0 10px 24px rgba(47, 111, 237, 0.25);
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin: 18px 0;
      }
      .stat-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 12px;
      }
      .stat-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8ea3c7;
      }
      .stat-value {
        font-size: 24px;
        margin-top: 6px;
        font-weight: 700;
      }
      .summary {
        margin-top: 16px;
        padding: 14px 16px;
        background: rgba(255,255,255,0.04);
        border-left: 3px solid #5b8cff;
        border-radius: 10px;
        color: #dfe9ff;
      }
      .log-list {
        margin-top: 16px;
      }
      .log-item {
        padding: 10px 12px;
        background: rgba(255,255,255,0.04);
        border-radius: 10px;
        margin-bottom: 8px;
        border-left: 3px solid #44d48d;
      }
      .meta-pill {
        display: inline-block;
        margin-top: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(68, 212, 141, 0.16);
        color: #8bf0bc;
        font-size: 12px;
      }
      .decision {
        margin-top: 16px;
        padding: 16px;
        background: rgba(91, 140, 255, 0.08);
        border: 1px solid rgba(91, 140, 255, 0.35);
        border-radius: 14px;
      }
      .decision-title {
        font-weight: 700;
        font-size: 17px;
        margin-bottom: 4px;
      }
      .decision-desc {
        color: #c3cfe8;
        margin-bottom: 12px;
      }
      .decision-options {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .option-btn {
        flex: 1 1 220px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.16);
        color: #f3f6ff;
        border-radius: 12px;
        padding: 12px 14px;
        cursor: pointer;
        text-align: left;
        font-weight: 600;
        margin-top: 0;
      }
      .option-btn:hover {
        background: rgba(91, 140, 255, 0.2);
        border-color: rgba(91, 140, 255, 0.5);
      }
      .seed-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .seed-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8ea3c7;
      }
      .seed-input {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.16);
        color: #f3f6ff;
        border-radius: 999px;
        padding: 9px 14px;
        width: 170px;
        font-family: inherit;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>LOL Career Simulator</h1>
      <p class="subtitle" id="identidad">Una carrera de LoL en formato narrativo, con progreso, meta y eventos.</p>
      <div class="seed-row">
        <label class="seed-label" for="seedInput">Seed</label>
        <input id="seedInput" class="seed-input" type="text" inputmode="numeric" placeholder="vacío = al azar" />
        <button id="run">Comenzar carrera</button>
      </div>

      <div class="stats">
        <div class="stat-card"><div class="stat-label">Edad</div><div id="edad" class="stat-value">—</div></div>
        <div class="stat-card"><div class="stat-label">Mecánica</div><div id="mec" class="stat-value">—</div></div>
        <div class="stat-card"><div class="stat-label">Mentalidad</div><div id="ment" class="stat-value">—</div></div>
        <div class="stat-card"><div class="stat-label">Estudios</div><div id="stud" class="stat-value">—</div></div>
        <div class="stat-card"><div class="stat-label">Confianza</div><div id="trust" class="stat-value">—</div></div>
        <div class="stat-card"><div class="stat-label">Sueño</div><div id="sleep" class="stat-value">—</div></div>
        <div class="stat-card"><div class="stat-label">SoloQ LP</div><div id="elo" class="stat-value">—</div></div>
        <div class="stat-card"><div class="stat-label">Fase</div><div id="fase" class="stat-value">—</div></div>
      </div>

      <div id="summary" class="summary">Aún no empezaste tu carrera.</div>
      <div id="metaPill" class="meta-pill"></div>

      <div id="decision" class="decision" hidden>
        <div id="decisionTitle" class="decision-title"></div>
        <div id="decisionDesc" class="decision-desc"></div>
        <div id="decisionOptions" class="decision-options"></div>
      </div>

      <div id="logList" class="log-list"></div>
    </div>

    <script type="module">
      const button = document.getElementById('run');
      const edad = document.getElementById('edad');
      const mec = document.getElementById('mec');
      const ment = document.getElementById('ment');
      const stud = document.getElementById('stud');
      const trust = document.getElementById('trust');
      const sleep = document.getElementById('sleep');
      const elo = document.getElementById('elo');
      const fase = document.getElementById('fase');
      const summary = document.getElementById('summary');
      const metaPill = document.getElementById('metaPill');
      const logList = document.getElementById('logList');
      const decisionPanel = document.getElementById('decision');
      const decisionTitle = document.getElementById('decisionTitle');
      const decisionDesc = document.getElementById('decisionDesc');
      const decisionOptions = document.getElementById('decisionOptions');

      const seedInput = document.getElementById('seedInput');
      const identidad = document.getElementById('identidad');
      const FASE_LABEL = { amateur: 'Amateur', profesional: 'Profesional', retirado: 'Retirado' };

      let modulos = null;
      let estado = null;
      let rng = null;

      async function cargarModulos() {
        if (!modulos) {
          const [{ mulberry32 }, { createInitialState }, pipeline, { BALANCE }, { etiquetaRol }] = await Promise.all([
            import('./src/core/rng.js'),
            import('./src/core/state.js'),
            import('./src/core/pipeline.js'),
            import('./src/data/balance.js'),
            import('./src/data/roles.js')
          ]);
          modulos = { mulberry32, createInitialState, pipeline, BALANCE, etiquetaRol };
        }
        return modulos;
      }

      function renderStats(state) {
        const pool = state.player.championPool.map((campeon) => campeon.name).join(', ');
        identidad.textContent =
          `${state.player.name} · ${modulos.etiquetaRol(state.player.role)} · ${state.mundo.ligaOrigen} (${state.mundo.regionOrigen}) · pool: ${pool}`;
        edad.textContent = state.age;
        mec.textContent = state.player.stats.mecanica;
        ment.textContent = state.player.stats.mentalidad;
        stud.textContent = state.player.studies;
        trust.textContent = state.player.familyTrust;
        sleep.textContent = state.player.sleep;
        elo.textContent = state.player.soloqElo;
        fase.textContent = FASE_LABEL[state.phase] ?? state.phase;
      }

      function renderLogs(state) {
        const recientes = state.logs.slice(-8).reverse();
        logList.innerHTML = recientes.map((entry) => `<div class="log-item">${entry.message}</div>`).join('');
      }

      function renderResumenFinal(state) {
        const strongestMeta = Object.entries(state.meta.weights).sort((a, b) => b[1] - a[1])[0][0];

        if (state.phase === 'profesional') {
          summary.textContent = `Te ficharon en el split ${state.splitFichaje}: arrancó tu carrera profesional. El meta dominante apunta a ${strongestMeta}.`;
        } else if (state.finAnticipado === 'fracaso_familia') {
          summary.textContent = 'Tu familia te bajó del ranked antes de que llegara la oportunidad: la carrera terminó en la etapa amateur.';
        } else if (state.finAnticipado === 'fracaso_sueno') {
          summary.textContent = 'El burnout te sacó de carrera antes de debutar: la etapa amateur terminó en fracaso.';
        } else {
          summary.textContent = 'Seguís en etapa amateur, grindeando soloQ para llamar la atención de un equipo.';
        }
        metaPill.textContent = `Meta dominante: ${strongestMeta} · seed ${state.seed}`;
      }

      function mostrarDecision(decision) {
        const evento = decision.evento;
        decisionTitle.textContent = decision.contexto === 'cierre' ? `${evento.title} (fin de temporada)` : evento.title;
        decisionDesc.textContent = evento.description;
        decisionOptions.innerHTML = '';

        for (const opcion of evento.options) {
          const opcionBtn = document.createElement('button');
          opcionBtn.type = 'button';
          opcionBtn.className = 'option-btn';
          opcionBtn.textContent = opcion.label;
          opcionBtn.addEventListener('click', () => elegirOpcion(opcion.id));
          decisionOptions.appendChild(opcionBtn);
        }

        decisionPanel.hidden = false;
        summary.textContent = 'Tenés una decisión pendiente.';
        button.disabled = true;
      }

      function pintar() {
        renderStats(estado);
        renderLogs(estado);

        if (estado.pendiente) {
          mostrarDecision(estado.pendiente.decision);
          return true;
        }
        return false;
      }

      function avanzar() {
        const { pipeline, BALANCE } = modulos;

        for (let pasos = 0; pasos < BALANCE.partida.maxSplitsDeSeguridad; pasos += 1) {
          estado = pipeline.avanzarSplit(estado, rng).state;

          if (pintar()) {
            return;
          }
          if (estado.terminado) {
            break;
          }
        }

        renderStats(estado);
        renderLogs(estado);
        renderResumenFinal(estado);
        button.textContent = 'Nueva carrera';
        button.disabled = false;
      }

      function elegirOpcion(opcionId) {
        const { pipeline } = modulos;
        decisionPanel.hidden = true;

        estado = pipeline.resolverDecision(estado, { opcionId }, rng).state;

        if (pintar()) {
          return;
        }
        if (estado.terminado) {
          renderResumenFinal(estado);
          button.textContent = 'Nueva carrera';
          button.disabled = false;
          return;
        }

        avanzar();
      }

      function leerSeed() {
        const crudo = seedInput.value.trim();
        const elegida = Number(crudo);
        if (crudo !== '' && Number.isFinite(elegida)) {
          return Math.abs(Math.trunc(elegida));
        }
        return Date.now() >>> 0;
      }

      async function comenzarCarrera() {
        button.disabled = true;
        decisionPanel.hidden = true;
        summary.textContent = 'Arrancando la carrera...';
        metaPill.textContent = '';
        logList.innerHTML = '';

        try {
          const { mulberry32, createInitialState } = await cargarModulos();

          const seed = leerSeed();
          seedInput.value = String(seed);
          rng = mulberry32(seed);
          estado = createInitialState(seed, rng);

          avanzar();
        } catch (error) {
          const esArchivoLocal = location.protocol === 'file:';
          summary.textContent = esArchivoLocal
            ? 'Este juego usa módulos ES y no puede correr abriendo el HTML directo con doble clic.'
            : 'No se pudo cargar el juego.';
          metaPill.textContent = esArchivoLocal
            ? 'Corré "npm start" en la terminal y abrí la URL que te muestra (http://localhost:8000).'
            : 'Revisa la consola del navegador.';
          logList.innerHTML = `<div class="log-item">${error.message}</div>`;
          console.error(error);
          button.disabled = false;
        }
      }

      button.addEventListener('click', comenzarCarrera);
    </script>
  </body>
</html>
