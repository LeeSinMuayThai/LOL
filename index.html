<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Un Split Más</title>
    <meta name="description" content="Un Split Más: simulá la carrera de un jugador profesional de League of Legends, de los 15 años al retiro. Elegís tu línea y tus mains, y cada decisión — soloQ, el mercado, el draft Fearless — deja una marca real en cómo termina la historia." />

    <!-- Fase 13e (P.4): el nombre del juego, decidido (venía diferido desde
         T.2). "Un Split Más" sale del vocabulario del juego mismo — el
         split es la unidad de tiempo de toda la partida (PLAN.md, "El
         compás") — y de la sensación central que persigue todo el diseño
         (CLAUDE.md: "breve, profunda y rejugable"). Open Graph + Twitter
         Card con imagen propia: `assets/og-image.svg` (fuente, autoría a
         mano) rasterizado a `assets/og-image.png` (1200×630, la misma
         medida que el canvas de `exportar.js`) con ImageMagick/librsvg —
         no un headless en el build, como pedía el plan. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Un Split Más — simulador de carrera de League of Legends" />
    <meta property="og:description" content="De los 15 años al retiro. Cada decisión deja una marca real en cómo termina tu historia." />
    <meta property="og:image" content="./assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Un Split Más — simulador de carrera de League of Legends" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Un Split Más — simulador de carrera de League of Legends" />
    <meta name="twitter:description" content="De los 15 años al retiro. Cada decisión deja una marca real en cómo termina tu historia." />
    <meta name="twitter:image" content="./assets/og-image.png" />

    <!-- El favicon: el mismo monograma cyan-sobre-negro del topbar, como
         SVG inline — cero archivo binario nuevo, coherente con "cero
         dependencias" del proyecto. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='2' fill='%23030407'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='14' font-weight='700' fill='%232ee8ff' text-anchor='middle'%3ES%2B%3C/text%3E%3C/svg%3E" />

    <!-- El sistema de diseño (fase T / T0). Hasta acá las 773 líneas de CSS
         vivían en un <style> acá adentro, sin una sola custom property. -->
    <link rel="preload" href="./src/ui/estilos/fuentes/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/ui/estilos/fuentes/barlow-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/ui/estilos/tokens.css" />
    <link rel="stylesheet" href="./src/ui/estilos/base.css" />
    <link rel="stylesheet" href="./src/ui/estilos/componentes.css" />
    <link rel="stylesheet" href="./src/ui/estilos/pantallas.css" />
    <!-- El shell de transmisión (fase T1): grilla de dos zonas, topbar, ticker. -->
    <link rel="stylesheet" href="./src/ui/estilos/shell.css" />
    <link rel="stylesheet" href="./src/ui/estilos/iconos.css" />
    <link rel="stylesheet" href="./src/ui/estilos/hud.css" />
    <link rel="stylesheet" href="./src/ui/estilos/overlay.css" />
    <link rel="stylesheet" href="./src/ui/estilos/material.css" />
  </head>
  <body>
    <a class="saltar-al-contenido" href="#escenario">Saltar al contenido</a>

    <div class="shell">
      <!-- El punto vivo (fase T2): `actualizarTopbar` en shell.js lo llena
           desde `ficha.js` en cada render — no desde acá, `estado` vive en
           el closure del <script> de abajo. Ver PLAN.md "T1/T2". -->
      <header class="topbar">
        <div class="topbar-live"><span class="topbar-live-punto"></span>LIVE</div>
        <div class="topbar-lockup">
          <span class="topbar-monograma">S+</span>
          <span class="topbar-nombre">Un Split Más</span>
        </div>
        <div class="topbar-estado" id="topbarEstado"></div>
        <div class="topbar-pips" id="topbarPips" hidden></div>
        <div class="topbar-controles">
          <!-- T3: velocidad del reproductor (x1/x2/instantáneo, cíclico) y
               sonido (apagado por defecto). Vivos recién cuando cargarModulos()
               resuelve — ver comenzarSetup()/iniciarSetup() más abajo. -->
          <button type="button" id="toggleVelocidad" class="topbar-toggle" disabled title="Velocidad del reproductor">1×</button>
          <button type="button" id="toggleSonido" class="topbar-toggle" disabled title="Sonido" aria-pressed="false"></button>
        </div>
      </header>

      <div class="shell-cuerpo">
        <aside class="riel" aria-label="Tu ficha">
          <div id="fichaContainer" class="ficha-card"></div>
        </aside>

        <div class="escenario" id="escenario">
          <div id="setup" class="panel">
            <h1 class="solo-lectores">Un Split Más</h1>
            <p class="subtitle">Elegís tu línea y tus mains. El resto de la carrera sale de ahí.</p>
            <section id="desafioDia" class="desafio-dia" aria-label="Desafío del día" hidden></section>

            <div class="paso">
              <div class="paso-label">Tu handle (opcional)</div>
              <input id="handleInput" class="handle-input" type="text" maxlength="16" placeholder="vacío = uno al azar" />
            </div>

            <div class="paso"><div class="paso-label">Tu perfil</div><div id="perfilGrid" class="perfil-grid" role="radiogroup" aria-label="Tu perfil"></div><div id="perfilTexto" class="perfil-texto"></div></div>
            <div class="paso">
              <div class="paso-label">Tu línea</div>
              <div id="rolGrid" class="rol-grid"></div>
            </div>

            <div class="paso">
              <div class="paso-label">Tus 3 mains</div>
              <div id="draftSlots" class="draft-slots" aria-label="Mains elegidos"></div>
              <div id="campeonGrid" class="campeon-grid"></div>
              <div id="poolContador" class="pool-contador">Elegí una línea primero.</div>
            </div>

            <div class="setup-footer">
              <!-- Fase T8 (P.2): oculto hasta que iniciarSetup() confirme
                   que hay una carrera guardada de verdad. -->
              <button id="continuarBtn" type="button" class="continuar-btn" hidden>
                <span class="continuar-kicker">Continuar</span>
                <span id="continuarDetalle" class="continuar-detalle"></span>
              </button>
              <button id="run" disabled>Empezar carrera</button>
            </div>
            <section id="historial" class="historial" aria-label="Tus últimos resultados" hidden></section>

            <details class="avanzado">
              <summary>Avanzado: fijar una seed</summary>
              <div class="seed-row" style="margin-top: 10px;">
                <label class="seed-label" for="seedInput">Seed</label>
                <input id="seedInput" class="seed-input" type="text" inputmode="numeric" placeholder="vacío = al azar" />
              </div>
            </details>
          </div>

          <div id="carrera" class="panel" hidden>
            <div id="summary" class="summary">Aún no empezaste tu carrera.</div>
            <div id="metaPill" class="meta-pill"></div>

            <!-- El bracket + el camino de la serie (fase T6): visible
                 mientras `state.serie.activa`, oculto el resto del tiempo. -->
            <div id="serieContexto" class="serie-contexto" hidden></div>
            <div id="previa" class="previa" hidden></div>

            <div id="decision" class="decision" hidden>
              <div id="decisionTitle" class="decision-title"></div>
              <div id="decisionDesc" class="decision-desc"></div>
              <div id="decisionOptions" class="decision-options"></div>
            </div>

            <div id="minijuego" class="minijuego" hidden>
              <div id="minijuegoTitle" class="decision-title"></div>
              <div id="minijuegoDesc" class="decision-desc"></div>
              <div id="minijuegoApuesta"></div>
              <div id="minijuegoWidget" class="minijuego-widget"></div>
            </div>

            <div id="mercado" class="mercado" hidden>
              <div id="mercadoTitle" class="decision-title"></div>
              <div id="mercadoDesc" class="decision-desc"></div>
              <div id="pretemporadaCols" class="pretemporada-cols">
                <div id="mercadoCol" class="pretemporada-col">
                  <div id="mercadoVos" hidden></div>
                  <div id="mercadoGrid" class="mercado-grid"></div>
                  <div id="mercadoMundo" class="mercado-mundo" hidden></div>
                  <button id="mercadoRepresentante" type="button" class="mercado-representante-btn" hidden>Llamar a tu representante y ver quién te sigue · 1 vez por carrera</button>
                  <button id="mercadoEsperar" type="button" class="mercado-representante-btn" hidden>Esperar · no firmás nada esta ventana</button>
                </div>
                <div id="mercadoPrep" class="pretemporada-col pretemporada-prep" hidden></div>
              </div>
            </div>

            <div id="logList" class="log-list" aria-live="polite"></div>

            <!-- Fase 9R5b: la tarjeta de legado. Se muestra cuando la carrera termina. -->
            <div id="tarjeta" class="tarjeta" hidden></div>

            <button id="nuevaCarrera" type="button" hidden>Nueva carrera</button>
          </div>
        </div>

        <!-- El riel derecho (fase T5): cinco paneles de contexto, todos con
             datos que el motor ya calcula y hasta esta fase no se veían en
             ningún lado. Cada uno se oculta solo (`hidden`) si no tiene
             nada real que mostrar — la columna entera se colapsa por CSS
             (`:has()` en shell.css) cuando los cinco están vacíos, en vez
             de dejar un hueco fantasma durante el setup o en amateur. -->
        <aside class="riel-der" aria-label="Contexto de la carrera">
          <div id="panelTabla" class="panel-contexto" hidden></div>
          <div id="panelCalendario" class="panel-contexto" hidden></div>
          <div id="panelPlantilla" class="panel-contexto" hidden></div>
          <div id="panelMeta" class="panel-contexto" hidden></div>
          <div id="panelGeneracion" class="panel-contexto" hidden></div>
          <div id="panelTopMundial" class="panel-contexto" hidden></div>
        </aside>
      </div>

      <footer class="ticker" id="ticker" aria-hidden="true"></footer>
    </div>

    <script type="module" src="./src/ui/shell.js"></script>
    <!-- El controlador (fase V, PLAN.md "V0 — El kernel"): hasta esta fase
         vivía acá adentro como ~520 líneas de `<script type="module">`.
         Se movió a `src/ui/app.js` (exporta `iniciar()`) para que `estado`
         deje de estar atrapado en un closure que ninguna pantalla nueva
         puede leer — ver `src/ui/core/store.js`. -->
    <script type="module">
      import { iniciar } from './src/ui/app.js';
      iniciar();
    </script>
  </body>
</html>
