<!DOCTYPE html>
<html lang="es">
  <head>

    <title>Lolero</title>
    <meta name="description" content="Lolero: simulá la carrera de un jugador profesional de League of Legends, de los 15 años al retiro. Elegís tu línea y tus mains, y cada decisión — soloQ, el mercado, el draft Fearless — deja una marca real en cómo termina la historia." />

    <link rel="stylesheet" href="./src/ui/estilos/iconos.css" />
    <link rel="stylesheet" href="./src/ui/estilos/hud.css" />
    <link rel="stylesheet" href="./src/ui/estilos/overlay.css" />

    <link rel="stylesheet" href="./src/ui/estilos/cuartos.css" />
    <link rel="stylesheet" href="./src/ui/estilos/ejes.css" />

  </head>
  <body>
    <a class="saltar-al-contenido" href="#escenario">Saltar al contenido</a>
    <!-- El ambiente (PLANUI §6.1): detrás de todo; lo monta src/ui/shell.js con src/ui/fx/ después de idle. -->
    <div id="fx-ambiente" class="fx-ambiente" aria-hidden="true"></div>

    <div class="shell" data-pieza="inicio">
      <!-- La franja (PLANUI §0.2, el marco de la vitrina): `#franjaEstado` lo llena src/ui/franja.js desde la `vista`. Los
           controles se encienden cuando cargan los módulos (app.js, iniciarSetup). -->
      <header class="franja" id="franja">
        <div class="franja-lockup"><span class="franja-monograma">L</span><span class="franja-nombre">Lolero</span></div>
        <div class="franja-estado" id="franjaEstado"></div>
        <div class="franja-controles">
          <button type="button" id="toggleTextos" class="franja-toggle" title="Textos: breves o completos" aria-pressed="false" disabled>Aa</button>
          <button type="button" id="ayudaTeclas" class="franja-toggle" aria-keyshortcuts="?" title="Teclas (?)" disabled>?</button>
          <button type="button" id="toggleVelocidad" class="franja-toggle franja-vel" disabled title="Velocidad: normal (1×) — clic para cambiar" aria-label="Velocidad: normal (1×) — clic para cambiar"><span class="franja-vel-rotulo" aria-hidden="true">VEL</span><span class="franja-vel-valor">1×</span></button>
          <button type="button" id="toggleSonido" class="franja-toggle" disabled title="Sonido" aria-pressed="false"></button>
        </div>
      </header>

      <!-- El cuerpo: el escenario (una pieza a la vista) y el acompañante a la derecha (la placa "Vos"). -->
      <div class="shell-cuerpo">
        <div class="escenario" id="escenario">
          <!-- El inicio: el champ select de la vitrina (op=linea). Lo llena src/ui/screens/inicio.js. -->
          <div id="setup" class="inicio" data-piezas="inicio">
            <header class="in-cabeza">
              <p class="in-kicker"><i class="punto-luz"></i><span>Nueva carrera</span><button type="button" class="in-ver-intro" id="verIntro">Ver intro</button></p>
              <h1 class="in-titulo" data-foco tabindex="-1">Lolero</h1>
              <p class="in-bajada subtitle">De los 15 años al retiro. Tu carrera de LoL, un split a la vez.</p>
            </header>
            <div class="in-cs-foco" id="inicioFoco" aria-hidden="true"></div>
            <div class="in-form">
              <div class="in-campo"><label class="in-rotulo" for="handleInput">Invocador</label><input id="handleInput" class="in-handle" type="text" maxlength="16" spellcheck="false" autocomplete="off" placeholder="vacío = uno al azar" /></div>
              <div class="in-campo"><p class="in-rotulo">Servidor</p><div><div id="regionGrid" class="in-servidores" role="radiogroup" aria-label="Tu región"></div><p id="regionTexto" class="in-linea"></p></div></div>
              <div class="in-campo"><p class="in-rotulo">Perfil</p><div class="in-perfil-linea"><div id="perfilGrid" class="in-perfiles" role="radiogroup" aria-label="Tu perfil"></div><span id="perfilTexto" class="in-perfil-texto"></span></div></div>
              <section class="in-cs" id="champSelect" aria-label="Selección de campeones">
                <div id="rolGrid" class="in-cs-roles" role="radiogroup" aria-label="Tu línea"></div>
                <p class="in-cs-k"><span>Tus mains</span><b id="poolContador" class="in-cs-cuenta"></b></p>
                <div id="campeonGrid" class="in-cs-grilla" role="group"></div>
                <ol id="draftSlots" class="in-cs-cartas" aria-label="Tus 3 mains"></ol>
                <p id="rolTexto" class="in-linea in-cs-rol-txt"></p>
                <div class="in-cs-accion"><button id="run" type="button" class="ln-bloquear in-cs-bloquear" disabled>Bloquear</button></div>
              </section>
            </div>
            <aside class="in-lado">
              <!-- Oculto hasta que iniciarSetup() confirme que hay una carrera guardada de verdad. -->
              <button id="continuarBtn" type="button" class="in-continuar" hidden>
                <canvas id="continuarArte" class="in-cont-arte" width="520" height="220" aria-hidden="true"></canvas>
                <span class="in-cont-txt"><span class="in-cont-k">Continuar</span><b id="continuarQuien"></b><span id="continuarDetalle"></span></span>
              </button>
              <section id="desafioDia" class="in-desafio" aria-label="Desafío del día" hidden></section>
              <section id="historial" class="in-historial" aria-label="Tus últimas carreras" hidden></section>
              <details class="avanzado in-avanzado">
                <summary>Avanzado: fijar una seed</summary>
                <div class="seed-row">
                  <label class="seed-label" for="seedInput">Seed</label>
                  <input id="seedInput" class="seed-input" type="text" placeholder="un número o un texto; vacío = al azar" />
                </div>
                <p id="seedAviso" class="seed-aviso" role="status" aria-live="polite"></p>
              </details>
            </aside>
          </div>

          <!-- La carrera: qué nodo se ve lo decide `.shell[data-pieza]` (lo escribe solo src/ui/escena.js) contra el
               `data-piezas` de cada nodo (estilos/shell.css). Cada familia de parada pinta su contenedor entero. -->
          <div id="carrera" class="carrera" data-piezas="relato decision partido mercado minijuego final">
            <!-- La línea "antes" de la parada (lo último que el relato contó, y la página a un toque). -->
            <div id="paradaAntes" class="antes-fila" data-piezas="decision" hidden></div>
            <!-- La decisión y el partido: la familia pinta su panel (o su transmisión) entero. -->
            <div id="decision" class="decision" data-piezas="decision partido"></div>
            <!-- La previa del partido: la ve el minijuego (antes del widget). -->
            <div id="previa" class="previa" data-piezas="minijuego" hidden></div>

            <div id="minijuego" class="minijuego panel" data-piezas="minijuego" hidden>
              <div id="minijuegoTitle" class="titulo-parada"></div>
              <div id="minijuegoDesc" class="planteo"></div>
              <div id="minijuegoApuesta"></div>
              <div id="minijuegoWidget" class="minijuego-widget"></div>
            </div>

            <!-- El mercado: la familia pinta las ofertas y la firma sobre el contrato (el fichaje va en su propia capa). -->
            <div id="mercado" class="mercado" data-piezas="mercado"></div>

            <!-- Debajo de 1180 px (sin acompañante) abre el cuarto con el contexto de la parada (src/ui/acompanante.js). -->
            <button id="verContexto" type="button" class="chip-contexto" data-piezas="decision" hidden></button>

            <!-- El relato: la página del split (cartel, beats con su ícono, la tarjeta de cierre). -->
            <div id="logList" class="log-list relato-pagina" aria-live="polite" data-piezas="relato"></div>

            <!-- La final: la carta y el veredicto. -->
            <div id="tarjeta" class="tarjeta" data-piezas="final" hidden></div>
            <button id="nuevaCarrera" type="button" class="boton boton-pri" data-piezas="final">Nueva carrera</button>
          </div>
        </div>

        <!-- El acompañante: la placa "Vos" (u otro contexto de la pieza), desde 1180 px. Lo pinta src/ui/acompanante.js
             desde la `vista`; `data-acompanante` dice qué muestra (vacío: nada, y no ocupa lugar). -->
        <aside id="acompanante" class="acompanante contexto" aria-label="Contexto de la parada" data-acompanante="" hidden></aside>
      </div>

      <!-- La barra de abajo: los 6 cuartos (la letra de aria-keyshortcuts abre cada uno, teclado.js) y la trayectoria. -->
      <nav class="cuartos" id="cuartosBarra" aria-label="Cuartos">
        <button type="button" class="cuarto-boton" data-cuarto="vos" aria-keyshortcuts="V"><span class="cuarto-nombre"><span class="cuarto-letra">V</span>os</span></button>
        <button type="button" class="cuarto-boton" data-cuarto="temporada" aria-keyshortcuts="T"><span class="cuarto-nombre"><span class="cuarto-letra">T</span>emporada</span></button>
        <button type="button" class="cuarto-boton" data-cuarto="equipo" aria-keyshortcuts="E"><span class="cuarto-nombre"><span class="cuarto-letra">E</span>quipo</span></button>
        <button type="button" class="cuarto-boton" data-cuarto="mundo" aria-keyshortcuts="M"><span class="cuarto-nombre"><span class="cuarto-letra">M</span>undo</span></button>
        <button type="button" class="cuarto-boton" data-cuarto="carrera" aria-keyshortcuts="C"><span class="cuarto-nombre"><span class="cuarto-letra">C</span>arrera</span></button>
        <button type="button" class="cuarto-boton" data-cuarto="cronica" aria-keyshortcuts="R"><span class="cuarto-nombre">C<span class="cuarto-letra">r</span>ónica</span></button>
        <div id="trayectoria" class="trayectoria" hidden></div>
      </nav>

      <!-- Los cuartos: un solo diálogo modal (showModal: foco atrapado, fondo inerte, Esc nativo). Las pestañas son copias
           de #cuartosBarra; el cuerpo se pinta solo al abrirse, desde la `vista` (src/ui/cuartos.js). -->
      <dialog id="cuarto" class="cuarto" aria-labelledby="cuartoTitulo">
        <div class="cuarto-cabecera">
          <h2 id="cuartoTitulo" class="solo-lectores">Cuarto</h2>
          <div class="cuarto-pestanas" role="tablist" aria-label="Cuartos"></div>
          <button type="button" class="cuarto-cerrar" title="Cerrar (Esc)" aria-label="Cerrar"><span class="cuarto-cerrar-texto">Cerrar</span><span class="cuarto-cerrar-x" aria-hidden="true">✕</span> <kbd>Esc</kbd></button>
        </div>
        <div id="cuartoCuerpo" class="cuarto-cuerpo" role="tabpanel" aria-labelledby="cuartoTitulo"></div>
      </dialog>
    </div>

    <script src="./src/ui/previa/almacen.js"></script>
    <script type="module" src="./src/ui/shell.js"></script>
    <!-- El controlador (fase V, PLAN.md "V0 — El kernel"): vive en `src/ui/app.js` (exporta `iniciar()`), no acá. -->
    <script type="module">
      import { iniciar } from './src/ui/app.js';
      iniciar();
    </script>
  </body>
</html>
