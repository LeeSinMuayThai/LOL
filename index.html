<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOL Career Simulator</title>

    <!-- El sistema de diseño (fase T / T0). Hasta acá las 773 líneas de CSS
         vivían en un <style> acá adentro, sin una sola custom property. -->
    <link rel="preload" href="./src/ui/estilos/fuentes/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/ui/estilos/fuentes/barlow-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/ui/estilos/tokens.css" />
    <link rel="stylesheet" href="./src/ui/estilos/base.css" />
    <link rel="stylesheet" href="./src/ui/estilos/componentes.css" />
    <link rel="stylesheet" href="./src/ui/estilos/pantallas.css" />
    <!-- El shell de transmisión (fase T1): grilla de dos zonas, topbar, ticker. -->
    <link rel="stylesheet" href="./src/ui/estilos/shell.css" />
  </head>
  <body>
    <a class="saltar-al-contenido" href="#escenario">Saltar al contenido</a>

    <div class="shell">
      <!-- Chrome estático en T1 (ver PLAN.md "T1 — El shell de transmisión"):
           `estado` vive en el closure del <script> de abajo, y exponerlo acá
           sería tocar el controlador. El punto vivo llega en T2. -->
      <header class="topbar">
        <div class="topbar-live"><span class="topbar-live-punto"></span>LIVE</div>
        <div class="topbar-lockup">
          <span class="topbar-monograma">LC</span>
          <span class="topbar-nombre">LoL Career Simulator</span>
        </div>
        <div class="topbar-controles">
          <button type="button" class="topbar-toggle" disabled title="El motion llega en la fase T3">⚙</button>
          <button type="button" class="topbar-toggle" disabled title="El audio llega en la fase T3">🔊</button>
        </div>
      </header>

      <div class="shell-cuerpo">
        <aside class="riel" aria-label="Tu ficha">
          <div id="fichaContainer" class="ficha-card"></div>
        </aside>

        <div class="escenario" id="escenario">
          <div id="setup" class="panel">
            <h1>LOL Career Simulator</h1>
            <p class="subtitle">Elegís tu línea y tus mains. El resto de la carrera sale de ahí.</p>

            <div class="paso">
              <div class="paso-label">Tu handle (opcional)</div>
              <input id="handleInput" class="handle-input" type="text" maxlength="16" placeholder="vacío = uno al azar" />
            </div>

            <div class="paso">
              <div class="paso-label">Paso 1 — Tu línea</div>
              <div id="rolGrid" class="rol-grid"></div>
            </div>

            <div class="paso">
              <div class="paso-label">Paso 2 — Tus 3 mains</div>
              <div id="campeonGrid" class="campeon-grid"></div>
              <div id="poolContador" class="pool-contador">Elegí una línea primero.</div>
            </div>

            <div class="setup-footer">
              <button id="run" disabled>Empezar carrera</button>
            </div>

            <details class="avanzado">
              <summary>Avanzado: fijar una seed</summary>
              <div class="seed-row" style="margin-top: 10px;">
                <label class="seed-label" for="seedInput">Seed</label>
                <input id="seedInput" class="seed-input" type="text" inputmode="numeric" placeholder="vacío = al azar" />
              </div>
            </details>
          </div>

          <div id="carrera" class="panel" hidden>
            <div id="summary" class="summary">Aún no empezaste tu carrera.</div>
            <div id="metaPill" class="meta-pill"></div>

            <div id="decision" class="decision" hidden>
              <div id="decisionTitle" class="decision-title"></div>
              <div id="decisionDesc" class="decision-desc"></div>
              <div id="decisionOptions" class="decision-options"></div>
            </div>

            <div id="minijuego" class="minijuego" hidden>
              <div id="minijuegoTitle" class="decision-title"></div>
              <div id="minijuegoDesc" class="decision-desc"></div>
              <div id="minijuegoWidget" class="minijuego-widget"></div>
            </div>

            <div id="mercado" class="mercado" hidden>
              <div id="mercadoTitle" class="decision-title"></div>
              <div id="mercadoDesc" class="decision-desc"></div>
              <div id="mercadoGrid" class="mercado-grid"></div>
              <button id="mercadoRepresentante" type="button" class="mercado-representante-btn" hidden>
                📞 Llamar a tu representante y pedir otras ofertas · 1 vez por carrera
              </button>
            </div>

            <div id="logList" class="log-list" aria-live="polite"></div>

            <!-- Fase 9R5b: la tarjeta de legado. Se muestra cuando la carrera termina. -->
            <div id="tarjeta" class="tarjeta" hidden></div>

            <button id="nuevaCarrera" type="button" hidden>Nueva carrera</button>
          </div>
        </div>
      </div>

      <footer class="ticker" id="ticker" aria-hidden="true"></footer>
    </div>

    <script type="module" src="./src/ui/shell.js"></script>
    <script type="module">
      const setupPanel = document.getElementById('setup');
      const carreraPanel = document.getElementById('carrera');
      const handleInput = document.getElementById('handleInput');
      const rolGrid = document.getElementById('rolGrid');
      const campeonGrid = document.getElementById('campeonGrid');
      const poolContador = document.getElementById('poolContador');

      const runButton = document.getElementById('run');
      const nuevaCarreraBtn = document.getElementById('nuevaCarrera');
      const fichaContainer = document.getElementById('fichaContainer');
      const summary = document.getElementById('summary');
      const metaPill = document.getElementById('metaPill');
      const logList = document.getElementById('logList');
      const decisionPanel = document.getElementById('decision');
      const decisionTitle = document.getElementById('decisionTitle');
      const decisionDesc = document.getElementById('decisionDesc');
      const decisionOptions = document.getElementById('decisionOptions');
      const minijuegoPanel = document.getElementById('minijuego');
      const minijuegoTitle = document.getElementById('minijuegoTitle');
      const minijuegoDesc = document.getElementById('minijuegoDesc');
      const minijuegoWidget = document.getElementById('minijuegoWidget');
      const mercadoPanel = document.getElementById('mercado');
      const mercadoTitle = document.getElementById('mercadoTitle');
      const mercadoDesc = document.getElementById('mercadoDesc');
      const mercadoGrid = document.getElementById('mercadoGrid');
      const mercadoRepresentante = document.getElementById('mercadoRepresentante');
      const tarjetaPanel = document.getElementById('tarjeta');
      const seedInput = document.getElementById('seedInput');

      // El contrato de elementos que `src/ui/render.js` necesita para pintar
      // la pantalla de carrera y la de decisión (fase 8, §8.5; fase 9c suma
      // la pantalla de ofertas).
      const carreraElements = { fichaContainer, logList };
      const decisionElements = { decisionPanel, decisionTitle, decisionDesc, decisionOptions };
      const mercadoElements = { mercadoPanel, mercadoTitle, mercadoDesc, mercadoGrid, mercadoRepresentante };

      let modulos = null;
      let ui = null;
      let pantallaInicio = null;
      let estado = null;
      let rng = null;
      // Regla invariable 1: los minijuegos tampoco pueden usar el azar del
      // navegador. Stream PROPIO, sembrado desde la misma seed pero separado del
      // rng del motor: si comieran del stream principal, el navegador (que juega
      // los minijuegos) y `simulate.js` (que resuelve por `resolverAuto` y nunca
      // los monta) divergirian para la misma seed, y una seed compartida dejaria
      // de reproducir la carrera. Asi el mundo sale igual en los dos lados y los
      // minijuegos siguen siendo deterministas (trampa T1).
      let rngUi = null;

      async function cargarModulos() {
        if (!modulos) {
          const [
            { mulberry32 }, { createInitialState }, pipeline, { BALANCE },
            rolesModulo, ranked, { describirContexto }, formato, campeonesModulo, render
          ] = await Promise.all([
            import('./src/core/rng.js'),
            import('./src/core/state.js'),
            import('./src/core/pipeline.js'),
            import('./src/data/balance.js'),
            import('./src/data/roles.js'),
            import('./src/core/ranked.js'),
            import('./src/core/contexto.js'),
            import('./src/core/formato.js'),
            import('./src/data/champions.json', { with: { type: 'json' } }),
            import('./src/ui/render.js')
          ]);
          modulos = {
            mulberry32, createInitialState, pipeline, BALANCE, formato,
            etiquetaRol: rolesModulo.etiquetaRol, ROLES: rolesModulo.ROLES,
            atributosClave: rolesModulo.atributosClave, IDS_ROL: rolesModulo.IDS_ROL,
            ranked, describirContexto,
            CAMPEONES: campeonesModulo.default
          };
          ui = render;
        }
        return modulos;
      }

      // --- Minijuegos (fase 4) ---
      //
      // El motor nunca los implementa (PLAN 4.6, regla 5): le pasás un
      // `resultado` 0-1 y listo. Acá SÍ se juegan de verdad — cinco mecánicas
      // chicas, cada una con su propia interacción, todas terminando en la
      // misma salida: `onDone(resultado)`. `resolverAuto` (systems/serie.js y
      // amateur.js) simula lo mismo con gauss corrido por el stat relevante
      // cuando no hay nadie mirando (simulate.js). No se mueven a `src/ui/`
      // en la fase 8 (PLAN.md §8.5): se les cambia la presentación en la 12.

      function montarRobarBaron(container, state, onDone) {
        const anchoZona = 14 + (state.player.stats.mecanica / 100) * 18;
        const centroZona = 25 + rngUi() * 50;
        container.innerHTML =
          '<div class="minijuego-barra"><div class="minijuego-zona"></div><div class="minijuego-marcador"></div></div>' +
          '<button type="button" class="minijuego-btn">¡Smite ya!</button>';

        const zona = container.querySelector('.minijuego-zona');
        zona.style.left = (centroZona - anchoZona / 2) + '%';
        zona.style.width = anchoZona + '%';
        const marcador = container.querySelector('.minijuego-marcador');
        const boton = container.querySelector('.minijuego-btn');

        let pos = 0;
        let dir = 1;
        let activo = true;
        function frame() {
          if (!activo) return;
          pos += dir * 1.7;
          if (pos >= 100) { pos = 100; dir = -1; }
          if (pos <= 0) { pos = 0; dir = 1; }
          marcador.style.left = pos + '%';
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        boton.addEventListener('click', () => {
          activo = false;
          const distancia = Math.abs(pos - centroZona);
          onDone(Math.max(0, 1 - distancia / 45));
        }, { once: true });
      }

      function montarLaLlamada(container, state, onDone) {
        container.innerHTML =
          '<div class="minijuego-aviso">Esperá la señal del equipo...</div>' +
          '<button type="button" class="minijuego-btn">¡Ahora!</button>';
        const aviso = container.querySelector('.minijuego-aviso');
        const boton = container.querySelector('.minijuego-btn');

        let listo = false;
        let inicio = 0;
        const espera = setTimeout(() => {
          listo = true;
          inicio = performance.now();
          aviso.textContent = '¡AHORA!';
        }, 900 + rngUi() * 2200);

        boton.addEventListener('click', () => {
          if (!listo) {
            clearTimeout(espera);
            onDone(0.05);
            return;
          }
          const latencia = performance.now() - inicio;
          onDone(Math.max(0, 1 - latencia / 700));
        }, { once: true });
      }

      function montarBootcamp(container, state, onDone) {
        const opciones = ['Matchups', 'El meta nuevo', 'Cabeza'];
        const objetivo = 5;
        let puntos = 0;
        let activo = true;

        container.innerHTML =
          '<div class="minijuego-barra-tiempo"><div class="minijuego-barra-tiempo-fill"></div></div>' +
          '<div class="minijuego-cards">' + opciones.map((label, i) => (
            '<button type="button" class="minijuego-card" data-i="' + i + '">' + label
            + '<span class="minijuego-card-count" data-count="' + i + '">0</span></button>'
          )).join('') + '</div>';

        const relleno = container.querySelector('.minijuego-barra-tiempo-fill');

        function terminar() {
          if (!activo) return;
          activo = false;
          onDone(Math.min(1, puntos / objetivo));
        }

        container.querySelectorAll('.minijuego-card').forEach((boton) => {
          boton.addEventListener('click', () => {
            if (!activo || puntos >= objetivo) return;
            puntos += 1;
            const contador = boton.querySelector('.minijuego-card-count');
            contador.textContent = String(Number(contador.textContent) + 1);
            if (puntos >= objetivo) terminar();
          });
        });

        const duracion = 6000;
        const inicio = performance.now();
        function frame(t) {
          if (!activo) return;
          const restante = Math.max(0, duracion - (t - inicio));
          relleno.style.width = (restante / duracion * 100) + '%';
          if (restante <= 0) { terminar(); return; }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      function montarRuedaDePrensa(container, state, onDone) {
        const objetivo = rngUi() * 100;
        container.innerHTML =
          '<input type="range" min="0" max="100" value="50" class="minijuego-slider" />' +
          '<div class="minijuego-slider-labels"><span>Humilde</span><span>Desafiante</span></div>' +
          '<button type="button" class="minijuego-btn">Responder</button>';

        const slider = container.querySelector('.minijuego-slider');
        const boton = container.querySelector('.minijuego-btn');
        boton.addEventListener('click', () => {
          const distancia = Math.abs(Number(slider.value) - objetivo);
          onDone(Math.max(0, 1 - distancia / 55));
        }, { once: true });
      }

      function montarLaPrueba(container, state, onDone) {
        const total = 5;
        let aciertos = 0;
        let ronda = 0;

        container.innerHTML = '<div class="minijuego-campo"></div><div class="minijuego-aim-info"></div>';
        const campo = container.querySelector('.minijuego-campo');
        const info = container.querySelector('.minijuego-aim-info');

        function siguiente() {
          if (ronda >= total) {
            onDone(aciertos / total);
            return;
          }
          ronda += 1;
          info.textContent = 'Blanco ' + ronda + ' de ' + total;

          const blanco = document.createElement('button');
          blanco.type = 'button';
          blanco.className = 'minijuego-blanco';
          blanco.style.left = (rngUi() * 85) + '%';
          blanco.style.top = (rngUi() * 75) + '%';

          const vencido = setTimeout(() => {
            blanco.remove();
            siguiente();
          }, 900);

          blanco.addEventListener('click', () => {
            clearTimeout(vencido);
            aciertos += 1;
            blanco.remove();
            siguiente();
          }, { once: true });

          campo.appendChild(blanco);
        }
        siguiente();
      }

      const MONTAR_MINIJUEGO = {
        robar_baron: montarRobarBaron,
        la_llamada: montarLaLlamada,
        bootcamp: montarBootcamp,
        rueda_de_prensa: montarRuedaDePrensa,
        la_prueba: montarLaPrueba
      };

      // Fase 9R0b: el motor ya recibia el `resultado` 0-1 y seguia de largo,
      // asi que el jugador nunca sabia si habia clavado el minijuego. Esto
      // traduce el 0-1 a un veredicto ("clavado / parejo / no salio") y la
      // consecuencia concreta, en el tono de los logs que el motor emite
      // despues. No toca el motor: el `resultado` que se le pasa es el mismo.
      const RESULTADO_MINIJUEGO = {
        robar_baron: {
          bien: 'El Barón es tuyo: el mapa se te va a favor.',
          parejo: 'Lo smiteás justo, sin sacar ventaja clara.',
          mal: 'Te roban el Barón: el mapa se complica.'
        },
        la_llamada: {
          bien: 'La llamada sale y todos te siguen: el mapa se inclina para tu lado.',
          parejo: 'La jugada sale a medias, sin cambiar mucho.',
          mal: 'Nadie reacciona a tiempo: el mapa se complica.'
        },
        bootcamp: {
          bien: 'El bootcamp rindió: llegás mejor preparado.',
          parejo: 'El bootcamp fue parejo, no alcanzó a pulir todo.',
          mal: 'El bootcamp se hizo cuesta arriba: llegás justo.'
        },
        rueda_de_prensa: {
          bien: 'El tono cae justo: el vestuario y la prensa lo toman bien.',
          parejo: 'La rueda de prensa pasa sin pena ni gloria.',
          mal: 'El tono no fue el mejor: la nota sale rara.'
        },
        la_prueba: {
          bien: 'Impresionaste en el tryout: entrás con crédito.',
          parejo: 'El tryout fue correcto, sin más.',
          mal: 'El tryout no terminó de convencer.'
        }
      };

      function veredictoMinijuego(minijuegoId, resultado) {
        const nivel = resultado >= 0.72 ? 'bien' : resultado >= 0.42 ? 'parejo' : 'mal';
        const titulo = nivel === 'bien' ? '¡Clavado!' : nivel === 'parejo' ? 'Salió parejo' : 'No salió';
        const porTipo = RESULTADO_MINIJUEGO[minijuegoId] ?? {
          bien: 'Salió bien.', parejo: 'Salió parejo.', mal: 'No salió.'
        };
        return { nivel, titulo, detalle: porTipo[nivel] };
      }

      function mostrarMinijuego(decision) {
        decisionPanel.hidden = true;
        mercadoPanel.hidden = true;
        minijuegoPanel.hidden = false;
        minijuegoTitle.textContent = decision.titulo;
        minijuegoDesc.textContent = decision.descripcion;
        minijuegoWidget.innerHTML = '';

        const montar = MONTAR_MINIJUEGO[decision.datos.minijuego];
        let resuelto = false;
        montar(minijuegoWidget, estado, (resultado) => {
          if (resuelto) {
            return;
          }
          resuelto = true;
          const v = veredictoMinijuego(decision.datos.minijuego, resultado);
          minijuegoWidget.innerHTML =
            '<div class="minijuego-resultado minijuego-resultado--' + v.nivel + '">'
            + '<div class="minijuego-resultado-titulo">' + v.titulo + '</div>'
            + '<div class="minijuego-resultado-detalle">' + v.detalle + '</div>'
            + '</div>';
          summary.textContent = v.titulo + ' ' + v.detalle;
          setTimeout(() => responder({ resultado }), 1600);
        });

        summary.textContent = 'Minijuego en curso.';
      }

      function mostrarDecision(decision) {
        if (decision.presentacion === 'minijuego') {
          mostrarMinijuego(decision);
          return;
        }

        minijuegoPanel.hidden = true;

        if (decision.presentacion === 'mercado') {
          decisionPanel.hidden = true;
          ui.mostrarMercadoEnPantalla(mercadoElements, decision, responder, () => responder({ representante: true }));
          summary.textContent = 'Llegaron ofertas: elegí con quién vas.';
          return;
        }

        mercadoPanel.hidden = true;
        ui.mostrarDecisionEnPantalla(decisionElements, decision, responder);
        summary.textContent = 'Tenés una decisión pendiente.';
      }

      function renderResumenFinal(state) {
        const strongestMeta = Object.entries(state.meta.weights).sort((a, b) => b[1] - a[1])[0][0];

        if (state.finAnticipado === 'burnout') {
          summary.textContent = `Te bajaste a los ${state.age}: no daba más la cabeza. `
            + `${state.career.titulos} título(s) con ${state.career.currentOrg ?? 'nadie'}.`;
        } else if (state.finAnticipado === 'prohibicion_familiar') {
          summary.textContent = `En tu casa te bajaron del ranked a los ${state.age}. Máximo alcanzado: ${modulos.ranked.etiquetaDeRanked(state.player.ranked, modulos.ranked.servidorDeLaPartida(state))}.`;
        } else if (state.finAnticipado === 'no_llego') {
          summary.textContent = `Se cerró la ventana de los prospectos en ${modulos.ranked.etiquetaDeRanked(state.player.ranked, modulos.ranked.servidorDeLaPartida(state))}. Nadie llamó.`;
        } else if (state.phase === 'profesional') {
          summary.textContent = `${state.career.currentOrg} · jerarquía ${state.career.jerarquia} · sinergia ${state.career.sinergia}`
            + ` · ${state.career.titulos} título(s) · ${state.career.internacionales} internacional(es)`
            + `${state.player.signatureChampion ? ` · signature: ${state.player.signatureChampion}` : ''}. Meta: ${strongestMeta}.`;
        } else {
          summary.textContent = 'Seguís en etapa amateur, grindeando soloQ para llamar la atención de un equipo.';
        }
        metaPill.textContent = `Meta dominante: ${strongestMeta} · seed ${state.seed}`;

        // Fase 9R5b: si la carrera terminó, la tarjeta de legado es la pantalla
        // final. Se ocultan los paneles de decisión y se pinta la tarjeta.
        if (state.terminado && state.tarjeta) {
          decisionPanel.hidden = true;
          minijuegoPanel.hidden = true;
          mercadoPanel.hidden = true;
          ui.renderTarjeta(tarjetaPanel, state, modulos);
        }
      }

      function pintar() {
        ui.renderCarrera(carreraElements, estado, modulos);

        if (estado.pendiente) {
          mostrarDecision(estado.pendiente.decision);
          return true;
        }
        return false;
      }

      function avanzar() {
        const { pipeline, BALANCE } = modulos;

        for (let pasos = 0; pasos < BALANCE.partida.maxSplitsDeSeguridad; pasos += 1) {
          estado = pipeline.avanzarSplit(estado, rng).state;

          if (pintar()) {
            return;
          }
          if (estado.terminado) {
            break;
          }
        }

        ui.renderCarrera(carreraElements, estado, modulos);
        renderResumenFinal(estado);
        nuevaCarreraBtn.hidden = false;
      }

      function responder(respuesta) {
        const { pipeline } = modulos;
        decisionPanel.hidden = true;
        minijuegoPanel.hidden = true;
        mercadoPanel.hidden = true;

        estado = pipeline.resolverDecision(estado, respuesta, rng).state;

        if (pintar()) {
          return;
        }
        if (estado.terminado) {
          renderResumenFinal(estado);
          nuevaCarreraBtn.hidden = false;
          return;
        }

        avanzar();
      }

      function leerSeed() {
        const crudo = seedInput.value.trim();
        const elegida = Number(crudo);
        if (crudo !== '' && Number.isFinite(elegida)) {
          return Math.abs(Math.trunc(elegida));
        }
        return Date.now() >>> 0;
      }

      async function comenzarCarrera() {
        runButton.disabled = true;
        decisionPanel.hidden = true;
        minijuegoPanel.hidden = true;
        mercadoPanel.hidden = true;
        tarjetaPanel.hidden = true;
        tarjetaPanel.replaceChildren();
        nuevaCarreraBtn.hidden = true;
        summary.textContent = 'Arrancando la carrera...';
        metaPill.textContent = '';
        logList.innerHTML = '';

        try {
          const { mulberry32, createInitialState } = await cargarModulos();

          const seed = leerSeed();
          seedInput.value = String(seed);
          rng = mulberry32(seed);
          rngUi = mulberry32((seed ^ 0x9E3779B9) >>> 0);
          // La elección de la pantalla de inicio entra como tercer argumento.
          // Si el jugador no eligió nada (camino headless), `createInitialState`
          // sortea todo de la seed exactamente como antes.
          const { rol, campeones } = pantallaInicio.getSeleccion();
          const eleccion = { handle: handleInput.value, rol, campeones };
          estado = createInitialState(seed, rng, eleccion);

          setupPanel.hidden = true;
          carreraPanel.hidden = false;

          avanzar();
        } catch (error) {
          const esArchivoLocal = location.protocol === 'file:';
          summary.textContent = esArchivoLocal
            ? 'Este juego usa módulos ES y no puede correr abriendo el HTML directo con doble clic.'
            : 'No se pudo cargar el juego.';
          metaPill.textContent = esArchivoLocal
            ? 'Corré "npm start" en la terminal y abrí la URL que te muestra (http://localhost:8000).'
            : 'Revisa la consola del navegador.';
          logList.innerHTML = `<div class="log-item">${error.message}</div>`;
          console.error(error);
          setupPanel.hidden = false;
          carreraPanel.hidden = true;
          runButton.disabled = false;
        }
      }

      function volverAlInicio() {
        carreraPanel.hidden = true;
        setupPanel.hidden = false;
        nuevaCarreraBtn.hidden = true;
        pantallaInicio.reset();
      }

      async function iniciarSetup() {
        try {
          await cargarModulos();
          pantallaInicio = ui.crearPantallaInicio(
            { rolGrid, campeonGrid, poolContador, runButton },
            modulos
          );
          pantallaInicio.render();
        } catch (error) {
          const esArchivoLocal = location.protocol === 'file:';
          rolGrid.textContent = esArchivoLocal
            ? 'Este juego usa módulos ES y no puede correr abriendo el HTML directo con doble clic. Corré "npm start" y abrí http://localhost:8000.'
            : `No se pudo cargar el juego: ${error.message}`;
          console.error(error);
        }
      }

      runButton.addEventListener('click', comenzarCarrera);
      nuevaCarreraBtn.addEventListener('click', volverAlInicio);
      iniciarSetup();
    </script>
  </body>
</html>
